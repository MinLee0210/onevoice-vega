[project]
name = "onevoice"
version = "0.1.0"
description = "On-device (no cloud) speech translation for noisy industrial environments"
requires-python = ">=3.10"
dependencies = [
    "qai-hub>=0.56.0",   # Qualcomm AI Hub SDK (scripts/qaihub/*)
    "onnx>=1.16",
    "numpy>=1.26",
]

[dependency-groups]
# Heavy ML stack for model eval/export/quantization (experiments/*.ipynb,
# scripts/quantize_mt.py). Not installed by default; opt in with:
#   uv sync --group experiments
experiments = [
    "torch",
    "transformers",
    "onnx",
    "onnxruntime",
    "optimum",
    "optimum-onnx",
    "sentencepiece",
    "sacremoses",
    "jupyter",
    "ipykernel",
    "soundfile",
    "jiwer",
    "sacrebleu",
    "uroman",
]

dev = [
    "ruff",
    "pre-commit",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["experiments"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

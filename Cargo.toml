[package]
name = "onevoice"
edition = "2021"
version = "0.1.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
hound = "3.5"
mel_spec = "0.4"
ndarray = "0.17"
nnnoiseless = { version = "0.5", default-features = false }
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokenizers = "0.23"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[package]
name = "onevoice"
edition = "2021"
version = "0.1.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
hound = "3.5"
mel_spec = "0.4"
ndarray = "0.17"
nnnoiseless = { version = "0.5", default-features = false }
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }
# default-features=false: skips `compile-espeak-intonations`, which fails
# to build from the crates.io package (broken relative path in the
# vendored CMakeLists, not a missing file -- see src/stages/tts.rs docs).
# Intonation curves are a prosody nicety, not required for phonemization.
piper-rs = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokenizers = "0.23"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uroman = "0.6"

# One entry per supported direction (6 total: VI paired with EN/ZH/KO,
# both ways). Model paths are relative to models/.
#
# asr_model_dir, mt_model_dir, and tts_model_dir all point at a directory
# (not a single file) -- see models/asr/vi/MANIFEST.md,
# models/mt/vi-en/MANIFEST.md, models/tts/*/MANIFEST.md. tts_model_dir is
# the *target* language's voice (what the device speaks), so several
# pairs share one (en->vi, zh->vi, ko->vi all use tts/vi).
#
# Pivot: VI<->ZH and VI<->KO have no direct Opus-MT model, so those pairs
# chain through English (`pivot = { lang = "en", mt_model_dir = ... }`).
# Here `mt_model_dir` is the source->pivot leg and `pivot.mt_model_dir` is
# the pivot->target leg; `MtChain` runs both and the glossary applies per
# leg. Direct pairs (vi-en, en-vi) omit `pivot`.
#
# MT model status (2026-10-12): all pivot legs exported --
#   vi-en, en-vi (optimum), en-zh, zh-en, ko-en, en-ko (optimum).
# ASR models exist for all directions (asr/vi covers VI;
# asr/en-zh-ko covers EN/ZH/KO). TTS voices exist for all 4 languages.

[[pair]]
source = "vi"
target = "en"
asr_model_dir = "asr/vi"
mt_model_dir = "mt/vi-en"
tts_model_dir = "tts/en"

[[pair]]
source = "en"
target = "vi"
asr_model_dir = "asr/en-zh-ko"
mt_model_dir = "mt/en-vi"
tts_model_dir = "tts/vi"

[[pair]]
source = "vi"
target = "zh"
asr_model_dir = "asr/vi"
mt_model_dir = "mt/vi-en"
tts_model_dir = "tts/zh"
pivot = { lang = "en", mt_model_dir = "mt/en-zh" }

[[pair]]
source = "zh"
target = "vi"
asr_model_dir = "asr/en-zh-ko"
mt_model_dir = "mt/zh-en"
tts_model_dir = "tts/vi"
pivot = { lang = "en", mt_model_dir = "mt/en-vi" }

[[pair]]
source = "vi"
target = "ko"
asr_model_dir = "asr/vi"
mt_model_dir = "mt/vi-en"
tts_model_dir = "tts/ko"
pivot = { lang = "en", mt_model_dir = "mt/en-ko" }

[[pair]]
source = "ko"
target = "vi"
asr_model_dir = "asr/en-zh-ko"
mt_model_dir = "mt/ko-en"
tts_model_dir = "tts/vi"
pivot = { lang = "en", mt_model_dir = "mt/en-vi" }

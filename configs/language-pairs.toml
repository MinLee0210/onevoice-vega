# One entry per supported direction. Model paths are relative to models/.
# Fill in as models are exported (see models/README.md for naming).
#
# asr_model_dir and mt_model_dir both point at a directory (tokenizer.json
# + encoder_model.onnx + decoder_model_merged.onnx), not a single file like
# tts_model -- see models/asr/vi/MANIFEST.md and models/mt/vi-en/MANIFEST.md.

[[pair]]
source = "vi"
target = "en"
asr_model_dir = "asr/vi"
mt_model_dir = "mt/vi-en"
tts_model = "tts/en/tts-en.onnx"

[[pair]]
source = "en"
target = "vi"
asr_model_dir = "asr/en-zh-ko"
mt_model_dir = "mt/en-vi"
tts_model = "tts/vi/tts-vi.onnx"

# vi-zh, zh-vi, vi-ko, ko-vi follow the same shape once models land.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # espeak-rs-sys (pulled in by piper-rs) compiles espeak-ng via CMake.
      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      # Only the always-on unit tests. Integration tests are #[ignore]d
      # because they need real ONNX models (gitignored, see models/README.md).
      - name: Unit tests
        run: cargo test

  shellcheck:
    name: Shellcheck (scripts/*.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"
          format: tty
